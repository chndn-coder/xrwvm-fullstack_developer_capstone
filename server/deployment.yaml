apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: dealership
  name: dealership

spec:
  replicas: 1

  selector:
    matchLabels:
      run: dealership

  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate

  template:
    metadata:
      labels:
        run: dealership

    spec:
      containers:
      - name: dealership
        image: us.icr.io/sn-labs-u221030401/dealership:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 8000
          protocol: TCP

      restartPolicy: Always